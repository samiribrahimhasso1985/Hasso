name: Android + Windows build

on:
  push:
    branches: [ main, ai-director-fx3 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared + Android)
        run: ./gradlew --no-daemon :shared:test testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AIDirectorFX3-android.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-android
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/AIDirectorFX3-android.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared + desktop)
        run: ./gradlew.bat --no-daemon :shared:test :desktop:test

      - name: Build Windows installer (MSI) and portable app
        run: ./gradlew.bat --no-daemon :desktop:packageMsi :desktop:createDistributable

      - name: Collect Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Copy-Item -Destination out/AIDirectorFX3-Windows-Setup.msi
          Compress-Archive -Path desktop/build/compose/binaries/main/app/AIDirectorFX3 -DestinationPath out/AIDirectorFX3-Windows-Portable.zip
          Get-ChildItem out

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: desktop/build/reports/tests/

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    if: github.event_name == 'push'
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish pre-release (Android APK + Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-director-fx3-build-${{ github.run_number }}
          name: AI Director FX3 — build ${{ github.run_number }} (Android + Windows)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built by GitHub Actions from commit ${{ github.sha }}. All unit tests passed on Linux and Windows.
            Tablet: download AIDirectorFX3-android.apk on the tablet, allow "Install unknown apps", open it.
            Windows 11: run AIDirectorFX3-Windows-Setup.msi, or unzip the portable version and start AIDirectorFX3.exe.
            The Windows files are not code-signed, so SmartScreen may warn: "More info" → "Run anyway".
          files: |
            dist/apk/AIDirectorFX3-android.apk
            dist/windows/AIDirectorFX3-Windows-Setup.msi
            dist/windows/AIDirectorFX3-Windows-Portable.zip
