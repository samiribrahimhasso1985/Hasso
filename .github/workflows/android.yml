name: Android build

on:
  push:
    branches: [ main, ai-director-fx3 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AIDirectorFX3-slice2.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIDirectorFX3-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-director-fx3-build-${{ github.run_number }}
          name: AI Director FX3 — slice 2 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug APK built by GitHub Actions from commit ${{ github.sha }}.
            All unit tests passed before this APK was built.
            Install: download the .apk on the tablet, allow "Install unknown apps", open it.
          files: app/build/outputs/apk/debug/AIDirectorFX3-slice2.apk
