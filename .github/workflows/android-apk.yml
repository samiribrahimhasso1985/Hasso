name: Build DIRECTOR MODE PRO APK

on:
  push:
    branches: [main, master, "ccr-*"]
    paths:
      - "DIRECTOR_MODE_PRO/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "DIRECTOR_MODE_PRO/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DIRECTOR_MODE_PRO
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK in $ANDROID_HOME; only make sure Platform 36 is present.
      - name: Install SDK Platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :link-core:test :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: director-mode-pro-debug-apk
          path: DIRECTOR_MODE_PRO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: DIRECTOR_MODE_PRO/app/build/reports/tests/
          if-no-files-found: ignore
