name: Build DIRECTOR MODE PRO APK

on:
  push:
    branches: [main, master, "ccr-*"]
    paths:
      - "DIRECTOR_MODE_PRO/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "DIRECTOR_MODE_PRO/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DIRECTOR_MODE_PRO
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: director-mode-pro-debug-apk
          path: DIRECTOR_MODE_PRO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: DIRECTOR_MODE_PRO/app/build/reports/tests/
          if-no-files-found: ignore
