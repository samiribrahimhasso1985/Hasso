name: family-tree-network
on:
  push:
    paths: ["family-tree-network/**", ".github/workflows/family-tree-network.yml"]
  pull_request:
    paths: ["family-tree-network/**", ".github/workflows/family-tree-network.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: family-tree-network
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ftn
          POSTGRES_PASSWORD: ftn_dev
          POSTGRES_DB: ftn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ftn" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-tree-network/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        working-directory: family-tree-network/apps/api
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ftn:ftn_dev@localhost:5432/ftn_test?schema=public
      - run: npm run build -w @ftn/web
