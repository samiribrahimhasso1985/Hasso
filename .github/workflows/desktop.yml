name: Desktop Studio (Windows)

on:
  push:
    branches: [ desktop-studio, ai-director-fx3 ]
    paths: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: desktop, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Environment
        run: |
          dotnet --info | Select-Object -First 15
          python --version
          [System.Environment]::OSVersion

      - name: Check UI strings (ar/de/en)
        run: python tools/check_strings.py

      - name: Build (Release)
        run: |
          dotnet restore DiscoveriesStudio.slnx
          dotnet build DiscoveriesStudio.slnx -c Release --no-restore

      - name: xUnit tests (unit + SQLite integration)
        run: dotnet test tests/Discoveries.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Python engine tests on Windows
        working-directory: desktop/engine
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -v

      - name: Publish self-contained win-x64
        run: dotnet publish src/Discoveries.Desktop -c Release -r win-x64 --self-contained true -o publish

      - name: Smoke test — launch the real app
        run: |
          $data = Join-Path $PWD "smoke-data"
          $env:DISCOVERIES_DATA_DIR = $data
          $p = Start-Process -FilePath "publish\Discoveries.Desktop.exe" -ArgumentList "--smoke-test" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "App did not finish smoke test in time" }
          if (Test-Path "$data\smoke-result.json") { Get-Content "$data\smoke-result.json" } else { Write-Host "no smoke-result.json" }
          Get-ChildItem "$data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$data\studio.db")) { throw "SQLite database was not created" }

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp installer\DiscoveriesStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer\Output

      - name: Package
        run: Compress-Archive -Path publish\* -DestinationPath DiscoveriesDesktopStudio-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-studio-windows
          path: |
            desktop/DiscoveriesDesktopStudio-portable-win-x64.zip
            desktop/installer/Output/*.exe
            desktop/TestResults/
            desktop/smoke-data/smoke-result.json
            desktop/smoke-data/logs/

      - name: Publish pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-studio-build-${{ github.run_number }}
          name: DISCOVERIES Desktop Studio — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built on GitHub Actions windows-latest from ${{ github.sha }}.
            Build, xUnit tests, Python engine tests and an automated launch (smoke test) of the real application all passed before this release was created.
            - `DiscoveriesDesktopStudio-Setup-*.exe` — Windows installer
            - `DiscoveriesDesktopStudio-portable-win-x64.zip` — portable version (unzip, run Discoveries.Desktop.exe)
            The installer is not code-signed yet, so Windows SmartScreen may warn ("More info" → "Run anyway").
          files: |
            desktop/DiscoveriesDesktopStudio-portable-win-x64.zip
            desktop/installer/Output/*.exe
