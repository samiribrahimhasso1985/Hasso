<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>IGINGAL — الحلقة الأولى (Paper-cut Motion)</title>
<style>
  @font-face { font-family: Plex; src: url(fonts/PlexArabic-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Plex; src: url(fonts/PlexArabic-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Cinzel; src: url(fonts/Cinzel-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Cunei; src: url(fonts/NotoSansCuneiform-Regular.ttf); }

  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0806; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .scene svg.art { position: absolute; left: 0; top: 0; }
  .cunei { font-family: Cunei; }
  .cinzel { font-family: Cinzel; font-weight: 700; }

  /* text blocks are always horizontally centred; only their top changes with orientation */
  .t { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 1500px; text-align: center; }
  .cap {
    padding: 16px 46px 22px; background: rgba(18, 12, 8, .86); color: #f3e6c8;
    font-family: Plex; font-size: 46px; line-height: 1.55;
    box-shadow: 0 14px 30px rgba(0,0,0,.55), inset 0 2px 0 rgba(227,178,90,.55);
    clip-path: polygon(0 4%, 3% 0, 18% 3%, 34% 0, 52% 4%, 70% 0, 88% 3%, 100% 0, 99% 50%, 100% 96%, 84% 100%, 66% 96%, 47% 100%, 29% 97%, 12% 100%, 0 96%, 1% 52%);
  }
  .cap.gold { background: #c99a45; color: #1a120a; box-shadow: 0 14px 30px rgba(0,0,0,.55); }
  .cap.small { font-size: 36px; padding: 12px 34px 16px; }
  .ttl { font-family: Plex; font-weight: 700; font-size: 70px; color: #ecc36f; line-height: 1.4;
         text-shadow: 0 0 24px rgba(236,170,70,.55), 0 4px 14px rgba(0,0,0,.8); }
  .tag { font-family: Plex; font-weight: 700; font-size: 30px; color: #ecc36f; padding: 8px 26px 12px;
         border: 2px solid rgba(236,195,111,.7); background: rgba(10,7,5,.6); }
  .w { display: inline-block; white-space: pre; }
  .v .t { max-width: 920px; }
  .v .cap { font-size: 44px; }
  .v .cap.small { font-size: 36px; }
  .v .ttl { font-size: 62px; }

  #dust { position: absolute; left: 0; top: 0; pointer-events: none; }
  #fx { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .35; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.6) 100%); }
  #wipe { position: absolute; top: -40px; height: 1160px; width: 2400px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ===================== setup =====================
const W = 1920, H = 1080, NS = 'http://www.w3.org/2000/svg';
// ?v=1 → vertical 9:16. The art is drawn in the same 1920×1080 space and viewed through a tall window.
const V = new URLSearchParams(location.search).get('v') === '1';
const SW = V ? 1080 : 1920, SH = V ? 1920 : 1080;
const VIEW = V ? '360 -526 1200 2133' : `0 0 ${W} ${H}`;
const hv = (h, v) => V ? v : h;

let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.3; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const stage = document.getElementById('stage');
if (V) { document.body.classList.add('v'); stage.style.width = SW + 'px'; stage.style.height = SH + 'px'; }

const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, s, attrs) => { const t = el('text', attrs, parent); t.textContent = s; return t; };

// centred text block; tops given for horizontal and vertical layouts
function T(root, cls, text, hTop, vTop, wordReveal = true) {
  const d = document.createElement('div');
  d.className = 't ' + cls; d.style.top = hv(hTop, vTop) + 'px';
  if (wordReveal) text.split(' ').forEach((w, i, a) => {
    const s = document.createElement('span'); s.className = 'w';
    s.textContent = w + (i < a.length - 1 ? ' ' : ''); d.appendChild(s);
  });
  else d.textContent = text;
  root.appendChild(d); d.style.opacity = 0;
  return d;
}
// show a block between a and b: rise + settle, word-by-word, fade out
function show(d, t, a, b, rot = 0) {
  const pin = eOut(prog(t, a, a + .6)), pout = prog(t, b - .45, b);
  d.style.opacity = pin * (1 - pout);
  d.style.transform = `translateY(${(1 - pin) * 34 - pout * 16}px) rotate(${rot}deg)`;
  const sp = d.querySelectorAll('.w'), n = sp.length;
  if (n) {
    const p = prog(t, a, a + Math.min(1.8, .25 + n * .16));
    sp.forEach((s, i) => { const q = eOut(clamp(p * n - i)); s.style.opacity = q; s.style.transform = `translateY(${(1 - q) * 14}px)`; });
  }
}

// ---------- torn paper geometry ----------
function ridge(y0, fn, jag = 6, step = 22, bottom = H + 900) {
  let d = `M-60 ${bottom} L-60 ${fn(-60)}`;
  for (let x = -60; x <= W + 80; x += step) d += ` L${x} ${(fn(x) + (rnd() - .5) * jag).toFixed(1)}`;
  return d + ` L${W + 80} ${bottom} Z`;
}
function tornRect(x, y, w, h, j = 6, step = 22) {
  const p = [];
  for (let i = 0; i <= w; i += step) p.push([x + i, y + (rnd() - .5) * j]);
  for (let i = 0; i <= h; i += step) p.push([x + w + (rnd() - .5) * j, y + i]);
  for (let i = w; i >= 0; i -= step) p.push([x + i, y + h + (rnd() - .5) * j]);
  for (let i = h; i >= 0; i -= step) p.push([x + (rnd() - .5) * j, y + i]);
  return 'M' + p.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L') + ' Z';
}
function tornCircle(cx, cy, r, j = 5, n = 80) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rr = r + (rnd() - .5) * j;
    d += (i ? ' L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return d + ' Z';
}
let svgN = 0;
function newSvg(root) {
  const s = el('svg', { class: 'art', viewBox: VIEW, preserveAspectRatio: 'xMidYMid slice', width: SW, height: SH }, root);
  const defs = el('defs', {}, s), id = ++svgN;
  const f = el('filter', { id: 'sh' + id, x: '-20%', y: '-20%', width: '140%', height: '160%' }, defs);
  el('feDropShadow', { dx: 0, dy: 10, stdDeviation: 10, 'flood-color': '#000', 'flood-opacity': .6 }, f);
  const gl = el('filter', { id: 'gl' + id, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  el('feGaussianBlur', { stdDeviation: 14, result: 'b' }, gl);
  const m = el('feMerge', {}, gl); el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'SourceGraphic' }, m);
  s.sh = `url(#sh${id})`; s.gl = `url(#gl${id})`; s.defs = s.querySelector('defs'); s.id_ = id;
  return s;
}
const P = (svg, parent, d, fill, extra = {}) => el('path', Object.assign({ d, fill, filter: svg.sh }, extra), parent);
const cam = (g, s, x = 0, y = 0, cx = 960, cy = 540) =>
  g.setAttribute('transform', `translate(${cx + x} ${cy + y}) scale(${s}) translate(${-cx} ${-cy})`);
function grad(svg, id, stops, vertical = true) {
  const g = el('linearGradient', { id: id + svg.id_, x1: 0, y1: 0, x2: vertical ? 0 : 1, y2: vertical ? 1 : 0 }, svg.defs);
  stops.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  return `url(#${id + svg.id_})`;
}
function rgrad(svg, id, stops) {
  const g = el('radialGradient', { id: id + svg.id_ }, svg.defs);
  stops.forEach(([o, c, op = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': op }, g));
  return `url(#${id + svg.id_})`;
}
const bg = (svg, g, fill) => el('rect', { x: -200, y: -900, width: 2400, height: 3000, fill }, g);
function sunsetSky(svg, g, horizon = 560) {
  bg(svg, g, grad(svg, 'sky', [[0, '#07060a'], [.45, '#2a1408'], [.78, '#8a4413'], [1, '#e08a2c']]));
  el('rect', { x: -200, y: horizon, width: 2400, height: 2000, fill: '#e08a2c' }, g);
}
// cuneiform-like wedge mark (carved): dark shape + light lower edge
function wedge(parent, x, y, s, rot, dark = '#3a2210', light = '#d9a066') {
  const g = el('g', { transform: `translate(${x} ${y}) rotate(${rot})` }, parent);
  const d = `M0 0 L${s * 1.3} ${-s * .5} L${s * 1.3} ${s * .5} Z M${s * 1.1} ${-s * .09} L${s * 3.2} ${-s * .05} L${s * 3.2} ${s * .07} L${s * 1.1} ${s * .09} Z`;
  el('path', { d, fill: light, transform: 'translate(2 2.5)', opacity: .55 }, g);
  el('path', { d, fill: dark }, g);
  return g;
}
function tabletRows(parent, x0, y0, w, h, rows, s = 16) {
  for (let r = 0; r < rows; r++) {
    const y = y0 + (r + .6) * h / rows;
    el('rect', { x: x0, y: y + h / rows * .42, width: w, height: 2, fill: '#5a3418', opacity: .5 }, parent);
    let x = x0 + 10;
    while (x < x0 + w - s * 3.4) {
      const k = rnd();
      if (k < .45) wedge(parent, x, y, s * (.7 + rnd() * .5), 0);
      else if (k < .8) wedge(parent, x + s, y - s * 1.6, s * (.6 + rnd() * .4), 90);
      else wedge(parent, x, y, s * .6, 45);
      x += s * (1.6 + rnd() * 1.6);
    }
  }
}
function ziggurat(svg, parent, cx, base, w, h, fill = '#140c07', rim = '#e9a24a') {
  const g = el('g', {}, parent), tiers = 4;
  for (let i = 0; i < tiers; i++) {
    const tw = w * (1 - i * .22), th = h / tiers, y = base - (i + 1) * th;
    P(svg, g, tornRect(cx - tw / 2, y, tw, th + 2, 3, 18), fill);
    el('rect', { x: cx - tw / 2, y, width: tw, height: 3, fill: rim, opacity: .55 }, g);
  }
  P(svg, g, tornRect(cx - w * .06, base - h * .55, w * .12, h * .55, 2, 12), fill);   // stairway
  return g;
}

// ---------- shared overlays ----------
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), img = g.createImageData(512, 512);
  for (let i = 0; i < img.data.length; i += 4) { const v = 100 + rnd() * 80; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c.toDataURL();
})();

// ===================== scenes =====================
const scenes = [];
// tr = transition INTO this scene: dissolve | black | glow | tear | burn | slide
const scene = (start, end, tr, dust, build) => {
  const root = document.createElement('div'); root.className = 'scene'; stage.appendChild(root);
  scenes.push({ start, end, tr, dust, root, update: build(root) });
};

// 1 · OPENING — black, golden dust gathers
scene(0, 5, 'black', 1, root => {
  const s = newSvg(root), g = el('g', {}, s);
  bg(s, g, '#050403');
  const glow = el('ellipse', { cx: 960, cy: 540, rx: 700, ry: 420, fill: rgrad(s, 'og', [[0, '#7a4a18', .55], [1, '#000', 0]]) }, g);
  const a = T(root, 'tag', 'من الطين… إلى الشاشة', 500, 900, false);
  return lt => {
    glow.setAttribute('opacity', ease(prog(lt, .5, 4)));
    cam(g, 1 + lt * .02);
    show(a, lt, 1.6, 4.8);
  };
});

// 2 · THE QUESTION — macro eye with a ziggurat reflected in the pupil
scene(5, 13, 'black', .5, root => {
  const s = newSvg(root), g = el('g', {}, s);
  bg(s, g, '#120a05');
  P(s, g, ridge(0, x => 120 + Math.sin(x / 300) * 30, 8), '#2a170b');          // brow / skin layers
  P(s, g, 'M200 540 Q960 40 1720 540 Q960 1040 200 540 Z', '#3a2312');
  P(s, g, 'M260 540 Q960 110 1660 540 Q960 970 260 540 Z', '#d8c3a0');           // sclera
  const iris = el('g', {}, g);
  P(s, iris, tornCircle(960, 540, 330, 8), '#5a2e0e');
  P(s, iris, tornCircle(960, 540, 300, 8), '#a0561a');
  for (let i = 0; i < 90; i++) {                                                  // iris fibres
    const a = i / 90 * Math.PI * 2, r1 = 130 + rnd() * 30, r2 = 250 + rnd() * 45;
    el('line', { x1: 960 + Math.cos(a) * r1, y1: 540 + Math.sin(a) * r1, x2: 960 + Math.cos(a) * r2, y2: 540 + Math.sin(a) * r2,
      stroke: rnd() < .5 ? '#e0a050' : '#6a3510', 'stroke-width': 3 + rnd() * 5, opacity: .7 }, iris);
  }
  P(s, iris, tornCircle(960, 540, 150, 6), '#0a0604');
  const refl = el('g', { opacity: .9 }, iris);
  el('rect', { x: 870, y: 470, width: 180, height: 120, fill: '#e9a24a', opacity: .25, rx: 10 }, refl);
  ziggurat(s, refl, 960, 590, 150, 90, '#2a1406', '#ffd27a');
  el('ellipse', { cx: 1040, cy: 450, rx: 34, ry: 22, fill: '#fff4dc', opacity: .85 }, iris);
  const lidT = P(s, g, 'M150 -100 L1770 -100 L1770 540 Q960 40 150 540 Z', '#24130a');
  const lidB = P(s, g, 'M150 1180 L1770 1180 L1770 540 Q960 1040 150 540 Z', '#1c0f07');
  const q1 = T(root, 'ttl', 'هل تكفي كلمتان قديمتان', 70, 300);
  const q2 = T(root, 'ttl', 'لتغيّرا طريقة نظرنا إلى الأشياء؟', 860, 1500);
  return lt => {
    const open = ease(prog(lt, .2, 1.8));
    lidT.setAttribute('transform', `translate(0 ${-(1 - open) * -360})`);
    lidB.setAttribute('transform', `translate(0 ${(1 - open) * -360})`);
    cam(g, 1 + lt * .035);
    iris.setAttribute('transform', `translate(${Math.sin(lt * .7) * 12} 0)`);
    show(q1, lt, 1.8, 7.6); show(q2, lt, 3.2, 7.6);
  };
});

// 3 · WHAT IF I TOLD YOU — clay tablet in raking light
scene(13, 21, 'dissolve', .4, root => {
  const s = newSvg(root), g = el('g', {}, s);
  bg(s, g, '#0d0805');
  const tab = el('g', { transform: 'rotate(-8 960 540)' }, g);
  P(s, tab, tornRect(260, hv(170, -250), 1400, hv(760, 1550), 16, 26), '#6b3d1c');
  P(s, tab, tornRect(285, hv(195, -225), 1350, hv(710, 1500), 12, 26), '#9a6234');
  tabletRows(tab, 320, hv(220, -200), 1280, hv(660, 1450), hv(7, 15), 20);
  el('rect', { x: -200, y: -900, width: 2400, height: 3000, fill: grad(s, 'rk', [[0, '#ffb35c'], [.5, '#000'], [1, '#000']], false), opacity: .35, 'mix-blend-mode': 'overlay' }, g);
  el('rect', { x: -200, y: -900, width: 2400, height: 3000, fill: grad(s, 'sh3', [[0, 'rgba(0,0,0,0)'], [.6, 'rgba(0,0,0,.2)'], [1, 'rgba(0,0,0,.85)']], false) }, g);
  const a = T(root, 'cap', 'ماذا لو أخبرتك…', 820, 1420);
  const b = T(root, 'cap', 'أن اسم هذه السلسلة مركّب من كلمتين سومريتين؟', 820, 1420);
  return lt => {
    cam(g, 1.15 - lt * .01, 60 - lt * 15, 0);
    show(a, lt, .8, 3.6); show(b, lt, 3.8, 7.6);
  };
});

// 4 · IGI and GAL — two glyphs lit in gold
scene(21, 30, 'glow', .8, root => {
  const s = newSvg(root), g = el('g', {}, s);
  bg(s, g, '#0f0905');
  P(s, g, tornRect(hv(140, 420), hv(140, -380), hv(1640, 1080), hv(800, 1880), 14, 30), '#24150b');
  const pos = V ? [[960, 120], [960, 860]] : [[620, 470], [1300, 470]];
  const div = el('rect', V ? { x: 560, y: 470, width: 800, height: 3, fill: '#e3b25a' } : { x: 958, y: 220, width: 3, height: 560, fill: '#e3b25a' }, g);
  const mk = ([x, y], ch, lat, ar) => {
    const gg = el('g', {}, g);
    txt(gg, ch, { x, y, 'text-anchor': 'middle', 'font-size': 300, class: 'cunei', fill: '#f0c26a', filter: s.gl });
    txt(gg, lat, { x, y: y + 150, 'text-anchor': 'middle', 'font-size': 84, class: 'cinzel', fill: '#f0c26a' });
    txt(gg, ar, { x, y: y + 250, 'text-anchor': 'middle', 'font-size': 64, 'font-family': 'Plex', 'font-weight': 700, fill: '#f3e6c8' });
    return gg;
  };
  const igi = mk(pos[0], '𒅆', 'IGI', '«العين»'), gal = mk(pos[1], '𒃲', 'GAL', '«الكبير»');
  const c = T(root, 'cap small', 'في السومرية: igi «العين» و gal «الكبير»', 900, 1640);
  return lt => {
    cam(g, 1 + lt * .01);
    [igi, gal].forEach((x, i) => {
      const q = eOut(prog(lt, .6 + i * 1.8, 1.8 + i * 1.8));
      x.setAttribute('opacity', q); x.setAttribute('transform', `translate(0 ${(1 - q) * 40})`);
    });
    div.setAttribute('opacity', prog(lt, .2, 1));
    show(c, lt, 4.8, 8.6);
  };
});

// 5 · FROM THE NAME TO HISTORY — aerial marshes at sunset
scene(30, 38, 'dissolve', .5, root => {
  const s = newSvg(root), g = el('g', {}, s);
  sunsetSky(s, g, 330);
  el('circle', { cx: 960, cy: 320, r: 260, fill: rgrad(s, 'sg', [[0, '#ffd27a', 1], [.25, '#f0a040', .8], [1, '#e08a2c', 0]]) }, g);
  P(s, g, ridge(0, x => 330 + Math.sin(x / 140) * 6, 4), '#3a200d');
  P(s, g, ridge(0, x => 360 + Math.sin(x / 200 + 2) * 8, 4), '#2a170a');
  for (let k = 0; k < 6; k++) {                                                   // winding gold channels
    const cx = 200 + k * 300 + rnd() * 100, ph = rnd() * 6;
    let d = '';
    for (let y = 340; y <= 1700; y += 20) {
      const depth = (y - 330) / 750, x = cx + (cx - 960) * depth * .8 + Math.sin(y / 70 + ph) * 40 * depth;
      d += (d ? ' L' : 'M') + x.toFixed(1) + ' ' + y;
    }
    el('path', { d, fill: 'none', stroke: '#f0b257', 'stroke-width': 4 + k % 3 * 4, 'stroke-linecap': 'round', opacity: .85, filter: s.gl }, g);
  }
  for (let i = 0; i < 70; i++) {                                                  // reed clumps
    const y = 380 + rnd() * 1300, sz = 6 + (y - 330) / 30;
    P(s, g, tornCircle(rnd() * W, y, sz, sz * .4, 14), i % 2 ? '#16100a' : '#22180c');
  }
  const tag = T(root, 'tag', 'من نحو 3350 ق.م. إلى اليوم', 470, 1000, false);
  const a = T(root, 'cap', 'لغةٌ كفّت عن الكلام اليومي قبل نحو أربعة آلاف عام…', 820, 1400);
  const b = T(root, 'cap gold', '…ثم بقيت قرونًا لغةً للكتبة والمعابد', 820, 1400);
  return lt => {
    cam(g, 1.18 - lt * .015, 0, lt * 6, 960, 330);
    show(tag, lt, .5, 7.6); show(a, lt, 1.2, 4.6); show(b, lt, 4.8, 7.6);
  };
});

// 6 · BIRTH OF WRITING — a hand presses wedges into clay
scene(38, 46, 'black', .3, root => {
  const s = newSvg(root), g = el('g', {}, s);
  bg(s, g, '#1a0e06');
  P(s, g, tornRect(-100, -900, 2200, 3000, 10, 30), '#8a5229');
  el('rect', { x: -200, y: -900, width: 2400, height: 3000, fill: rgrad(s, 'sp', [[0, '#ffb35c', .35], [1, '#000', .75]]) }, g);
  tabletRows(g, 160, hv(120, -380), 1600, hv(300, 300), hv(2, 2), 22);
  const marks = el('g', {}, g), MX = 520, MY = hv(560, 560), N = 9, pts = [];
  for (let i = 0; i < N; i++) {
    const x = MX + i * 100 + (i % 3 === 2 ? 20 : 0), vertical = i % 3 === 1;
    const m = wedge(marks, vertical ? x + 20 : x, vertical ? MY - 40 : MY, 26, vertical ? 90 : 0);
    m.setAttribute('opacity', 0); pts.push({ m, x: vertical ? x + 20 : x, y: vertical ? MY - 40 : MY });
  }
  const hand = el('g', {}, g);
  el('path', { d: 'M-150 -330 L32 54 L22 58 L-162 -324 Z', fill: '#c8a060' }, hand);           // reed stylus
  // paper-cut hand: forearm, palm and fingers wrapped round the stylus
  const limb = (x1, y1, x2, y2, w, c) => el('path', { d: `M${x1} ${y1} L${x2} ${y2}`, stroke: c, 'stroke-width': w, 'stroke-linecap': 'round', filter: s.sh }, hand);
  limb(-230, -230, -620, -560, 170, '#8a5632');

  const q = T(root, 'ttl', 'إن كان لك أن تضيف كلمةً واحدة إلى اسم هذه السلسلة… فما هي؟', 420, 760);
  const tg = T(root, 'cap', 'العين الكبيرة التي نعدك بها ليست عينًا أكبر من غيرها… هي عادةُ سؤالٍ لا تتعب', 790, 1340);
  const cta = T(root, 'tag', 'اكتب رأيك في التعليقات', 950, 1620, false);
  return lt => {
    show(q, lt, .3, 3.4);
    const p = eOut(prog(lt, 3.4, 5));
    logo.setAttribute('opacity', p);
    logo.setAttribute('transform', `translate(960 520) scale(${.8 + .2 * p}) translate(-960 -520)`);
    cam(g, 1 + lt * .01);
    show(tg, lt, 4.6, 8.4); show(cta, lt, 5.6, 8.4);
  };
});

const DURATION = 119.5;

// ===================== global layers & transitions =====================
const dust = el('svg', { id: 'dust', width: SW, height: SH, viewBox: `0 0 ${SW} ${SH}` });
stage.appendChild(dust);
{ const f = el('filter', { id: 'dg' }, el('defs', {}, dust)); el('feGaussianBlur', { stdDeviation: 1.6 }, f); }
const motes = [];
for (let i = 0; i < 140; i++) motes.push({ c: el('circle', { r: .8 + rnd() * 3.2, fill: rnd() < .8 ? '#f6c46a' : '#fff0c8', filter: 'url(#dg)' }, dust),
  x: rnd() * SW, y: rnd() * SH, vx: (rnd() - .5) * 14, vy: 6 + rnd() * 22, ph: rnd() * 6, f: .5 + rnd() * 2 });

const wipe = el('svg', { id: 'wipe', viewBox: '0 0 2400 1160', preserveAspectRatio: 'none' });
{
  let d = 'M120 0';
  for (let y = 0; y <= 1160; y += 26) d += ` L${120 + (rnd() - .5) * 50} ${y}`;
  for (let y = 1160; y >= 0; y -= 26) d += ` L${2280 + (rnd() - .5) * 50} ${y}`;
  el('path', { d: d + ' Z', fill: '#2a190c' }, wipe);
  el('path', { d: 'M120 0' + d.slice(6) + ' Z', fill: 'none', stroke: '#e3b25a', 'stroke-width': 4, opacity: .7 }, wipe);
}
if (V) wipe.style.height = (SH + 80) + 'px';
stage.appendChild(wipe);
const fx = document.createElement('div'); fx.id = 'fx'; stage.appendChild(fx);
const grain = document.createElement('div'); grain.id = 'grain'; grain.style.backgroundImage = `url(${GRAIN})`; stage.appendChild(grain);
const vig = document.createElement('div'); vig.id = 'vignette'; stage.appendChild(vig);

window.renderAt = function (t) {
  let dustLevel = 0, fxOp = 0, fxBg = '#000', wipeX = SW + 200;
  scenes.forEach((sc, idx) => {
    const tr = sc.tr, next = scenes[idx + 1];
    const lead = tr === 'dissolve' ? .9 : tr === 'slide' ? .8 : 0;     // incoming overlaps the previous scene
    let op = 0, tx = 0;
    if (t >= sc.start - lead && t < sc.end) {
      op = 1;
      if (tr === 'dissolve') op = prog(t, sc.start - lead, sc.start);
      if (tr === 'slide') tx = -(1 - ease(prog(t, sc.start - lead, sc.start))) * SW;   // enters from the left
    }
    if (idx === scenes.length - 1) op *= 1 - prog(t, sc.end - 1.2, sc.end);
    sc.root.style.opacity = op;
    sc.root.style.display = op > 0 ? 'block' : 'none';
    sc.root.style.transform = tx ? `translateX(${tx}px)` : '';
    if (op > 0) { sc.update(Math.max(0, t - sc.start)); dustLevel = Math.max(dustLevel, sc.dust * op); }
    // boundary effects centred on the cut
    const d = t - sc.start;
    if (tr === 'black' && Math.abs(d) < .6) fxOp = Math.max(fxOp, 1 - Math.abs(d) / .6);
    if (tr === 'glow' && Math.abs(d) < .5) { fxOp = Math.max(fxOp, .85 * (1 - Math.abs(d) / .5)); fxBg = 'radial-gradient(circle, #fff3d0 0%, #f0b257 45%, #6a3a10 100%)'; }
    if (tr === 'burn' && Math.abs(d) < .6) { fxOp = Math.max(fxOp, .9 * (1 - Math.abs(d) / .6)); fxBg = 'radial-gradient(ellipse at 100% 50%, #fff0c0 0%, #f08a20 35%, #6a1a00 75%, #000 100%)'; }
    if (tr === 'tear') { const p = prog(t, sc.start - .7, sc.start + .7); if (p > 0 && p < 1) wipeX = SW + 60 - ease(p) * (SW + 2480); }
  });
  if (t < .6) fxOp = 1 - t / .6;
  fx.style.opacity = fxOp; fx.style.background = fxBg;
  wipe.style.left = wipeX + 'px';
  dust.style.opacity = dustLevel;
  motes.forEach(m => {
    const x = ((m.x + t * m.vx + Math.sin(t * .6 + m.ph) * 25) % SW + SW) % SW;
    const y = ((m.y - t * m.vy) % SH + SH) % SH;
    m.c.setAttribute('cx', x.toFixed(1)); m.c.setAttribute('cy', y.toFixed(1));
    m.c.setAttribute('opacity', (.35 + .65 * Math.abs(Math.sin(t * m.f + m.ph))).toFixed(2));
  });
  grain.style.backgroundPosition = `${(t * 997) % 512 | 0}px ${(t * 613) % 512 | 0}px`;
};
window.DURATION = DURATION;
window.TRANSITIONS = scenes.filter(s => ['tear', 'slide', 'burn', 'glow'].includes(s.tr)).map(s => s.start);
Promise.all(['40px Plex', 'bold 40px Plex', 'bold 40px Cinzel', '40px Cunei'].map(f => document.fonts.load(f, 'اbA𒅆')))
  .then(() => document.fonts.ready).then(() => { window.READY = true; renderAt(0); });
</script>
