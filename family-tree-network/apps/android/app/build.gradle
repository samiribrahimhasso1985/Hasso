plugins {
    id 'com.android.application'
}

android {
    namespace 'net.ezidinet.dev'
    compileSdk 34

    defaultConfig {
        // Development application id. The final id depends on the domain decision (EZIDNET.COM vs EZIDINET).
        applicationId 'net.ezidinet.dev'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        // Debug builds are signed with the local debug key only — for testing, never for store release.
        debug { }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
