[versions]
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
hilt = "2.52"
hiltAndroidx = "1.2.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
